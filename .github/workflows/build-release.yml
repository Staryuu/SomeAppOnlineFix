name: Build and release

on:
  workflow_dispatch:
    inputs:
      onlinefix_version:
        description: 'OnlineFixManager version (for example 2.0.0; tag: v2.0.0)'
        required: true
        default: '2.0.0'
        type: string
      steam_version:
        description: 'A supported Steam build to validate (all bundled profiles are included)'
        required: true
        default: '1792618285'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.onlinefix_version }}
      STEAM_VERSION: ${{ inputs.steam_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check architecture and tools
        run: |
          test "$(uname -m)" = arm64
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$STEAM_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$RELEASE_VERSION" = "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' OnlineFixManager/Info.plist)"
          xcrun swiftc --version
          cmake --version
      - name: Configure Photon servers from secrets
        env:
          PHOTON_PUN_APP_IDS: ${{ secrets.PHOTON_PUN_APP_IDS }}
          PHOTON_VOICE_APP_IDS: ${{ secrets.PHOTON_VOICE_APP_IDS }}
        run: python3 scripts/configure-photon.py
      - name: Build and test
        run: make -j4 test
      - name: Package release
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: OnlineFixManager-macos-arm64
          path: out/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: OnlineFixManager-macos-arm64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.onlinefix_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" release/*.zip release/*.dmg release/SHA256SUMS --clobber
            gh release edit "v$RELEASE_VERSION" --notes-file release/notes.md --title "OnlineFixManager $RELEASE_VERSION"
          else
            gh release create "v$RELEASE_VERSION" release/*.zip release/*.dmg release/SHA256SUMS \
              --target "$RELEASE_COMMIT" --title "OnlineFixManager $RELEASE_VERSION" \
              --notes-file release/notes.md
          fi

